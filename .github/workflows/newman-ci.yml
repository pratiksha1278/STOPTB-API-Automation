name: STOPTB API - Newman Automation

on:
  workflow_dispatch:

  schedule:
    - cron: '30 4 * * *'

jobs:
  run-newman:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Download Collection
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          COLLECTION_UID: ${{ secrets.POSTMAN_COLLECTION_UID }}
        run: |
          curl -L \
          -H "X-Api-Key:$POSTMAN_API_KEY" \
          "https://api.getpostman.com/collections/$COLLECTION_UID" \
          -o collection.json

      - name: Download Environment
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          ENV_UID: ${{ secrets.POSTMAN_ENVIRONMENT_UID }}
        run: |
          curl -L \
          -H "X-Api-Key:$POSTMAN_API_KEY" \
          "https://api.getpostman.com/environments/$ENV_UID" \
          -o environment_raw.json

      - name: Convert Environment
        run: |
          node -e "
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('environment_raw.json'));
          const env=raw.environment;

          env.values.forEach(v=>{
            if(v.key==='username')
              v.value=process.env.USERNAME;
            if(v.key==='password')
              v.value=process.env.PASSWORD;
          });

          fs.writeFileSync(
            'environment.json',
            JSON.stringify(env,null,2)
          );
          "
        env:
          USERNAME: ${{ secrets.AMRIT_USERNAME }}
          PASSWORD: ${{ secrets.AMRIT_PASSWORD }}

      - name: Check Variables
        run: |
          node -e "
          const env=require('./environment.json');
          console.log(env.values.find(x=>x.key==='username'));
          console.log(env.values.find(x=>x.key==='password'));
          "

      - name: Test Connectivity
        run: |
          echo "Testing server..."
          curl -v --connect-timeout 20 https://amritdemo.piramalswasthya.org || true

      - name: Run Newman
        run: |
          mkdir -p reports

          newman run collection.json \
          -e environment.json \
          --reporters cli,htmlextra \
          --reporter-htmlextra-export reports/newman-report.html \
          --timeout-request 60000 \
          --delay-request 300 \
          --insecure \
          --verbose

      - name: Verify Report
        if: always()
        run: |
          ls -R
          ls -R reports || true

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STOPTB-Newman-Report
          path: reports

      - name: Send Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: STOPTB API Report #${{ github.run_number }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: STOPTB API Automation
          body: |
            Hi Team,

            Newman execution completed.

            Run Number: ${{ github.run_number }}

            Regards,
            Pratiksha Pandey

          attachments: reports/newman-report.html
