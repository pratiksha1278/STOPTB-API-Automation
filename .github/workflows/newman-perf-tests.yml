name: StopTB Perf Test Suite - Newman CI/CD

on:
  # Runs every day at 9:00 AM IST (03:30 UTC)
  schedule:
    - cron: '30 3 * * *'
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Optional: also run on pushes to main so changes are validated immediately
  push:
    branches: [ main ]

jobs:
  run-newman-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and reporters
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch Postman collection
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          COLLECTION_UID: ${{ secrets.POSTMAN_COLLECTION_UID }}
        run: |
          curl -s -H "X-Api-Key: $POSTMAN_API_KEY" \
            "https://api.getpostman.com/collections/$COLLECTION_UID" \
            -o collection_raw.json
          jq '.collection' collection_raw.json > collection.json

      - name: Fetch Postman environment
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          ENVIRONMENT_UID: ${{ secrets.POSTMAN_ENVIRONMENT_UID }}
        run: |
          curl -s -H "X-Api-Key: $POSTMAN_API_KEY" \
            "https://api.getpostman.com/environments/$ENVIRONMENT_UID" \
            -o environment_raw.json
          jq '.environment' environment_raw.json > environment.json

      - name: Create report output directory
        run: mkdir -p newman

      - name: Run Newman collection
        id: newman_run
        run: |
          newman run collection.json \
            -e environment.json \
            --reporters cli,json,htmlextra \
            --reporter-htmlextra-export newman/report.html \
            --reporter-json-export newman/report.json \
            --reporter-htmlextra-darkTheme \
            --reporter-htmlextra-title "StopTB Perf Test Suite Report" \
            --iteration-count 1
        continue-on-error: true

      - name: Generate detailed execution summary
        id: summary
        run: node scripts/generate-summary.js

      - name: Upload Newman report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: newman-report-${{ github.run_number }}
          path: |
            newman/report.html
            detailed-summary.html
          retention-days: 30

      - name: Send email with report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "StopTB Perf Test Suite - ${{ steps.summary.outputs.overall_status }} - ${{ steps.summary.outputs.total_requests }} requests, ${{ steps.summary.outputs.failed_assertions }} failed"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          html_body: |
            <h2>StopTB Perf Test Suite &mdash; Daily Run</h2>
            <p><strong>Collection:</strong> ${{ steps.summary.outputs.collection_name }}</p>
            <p><strong>Overall Status:</strong> ${{ steps.summary.outputs.overall_status }}</p>
            <table style="border-collapse:collapse;">
              <tr><td style="padding:4px 8px;border:1px solid #ccc;">Iterations</td><td style="padding:4px 8px;border:1px solid #ccc;">${{ steps.summary.outputs.total_iterations }}</td></tr>
              <tr><td style="padding:4px 8px;border:1px solid #ccc;">Requests</td><td style="padding:4px 8px;border:1px solid #ccc;">${{ steps.summary.outputs.total_requests }}</td></tr>
              <tr><td style="padding:4px 8px;border:1px solid #ccc;">Failed Requests</td><td style="padding:4px 8px;border:1px solid #ccc;">${{ steps.summary.outputs.failed_requests }}</td></tr>
              <tr><td style="padding:4px 8px;border:1px solid #ccc;">Assertions</td><td style="padding:4px 8px;border:1px solid #ccc;">${{ steps.summary.outputs.total_assertions }}</td></tr>
              <tr><td style="padding:4px 8px;border:1px solid #ccc;">Passed Assertions</td><td style="padding:4px 8px;border:1px solid #ccc;">${{ steps.summary.outputs.passed_assertions }}</td></tr>
              <tr><td style="padding:4px 8px;border:1px solid #ccc;">Failed Assertions</td><td style="padding:4px 8px;border:1px solid #ccc;">${{ steps.summary.outputs.failed_assertions }}</td></tr>
              <tr><td style="padding:4px 8px;border:1px solid #ccc;">Skipped Assertions</td><td style="padding:4px 8px;border:1px solid #ccc;">${{ steps.summary.outputs.skipped_assertions }}</td></tr>
              <tr><td style="padding:4px 8px;border:1px solid #ccc;">Execution Time</td><td style="padding:4px 8px;border:1px solid #ccc;">${{ steps.summary.outputs.execution_time_sec }} s</td></tr>
            </table>
            <p>Full Newman HTML report and the expandable per-request summary (with request/response bodies and timing) are attached.</p>
          attachments: newman/report.html,detailed-summary.html

      - name: Fail workflow if tests failed
        if: steps.newman_run.outcome == 'failure'
        run: exit 1